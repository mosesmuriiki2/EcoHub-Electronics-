{% extends 'home.html' %}
{% block title %}Ecohub Energy Africa Limited Business Report{% endblock %}
{% block header_actions %}<button onclick="window.print()" class="no-print inline-flex items-center gap-2 rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white"><i class="fa-solid fa-print"></i> Print this report</button>{% endblock %}
{% block content %}
<div class="mb-6 hidden print-only"><p class="text-sm font-semibold uppercase tracking-widest text-emerald-700">Ecohub</p><h2 class="text-3xl font-black text-slate-950">Business performance report</h2><p class="text-sm text-slate-500">Generated {{ report_date|date:"d M Y" }}</p></div>
{{ block.super }}
{% endblock %}
